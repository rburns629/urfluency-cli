name: Release

# Tagging vMAJOR.MINOR.PATCH builds each platform natively (tree-sitter uses cgo),
# publishes the archives and checksums to a GitHub Release, and updates the
# Homebrew formula in rburns629/homebrew-tap when HOMEBREW_TAP_TOKEN is set.
#
# Or start one from Actions → Release → Run workflow on main, with a version:
# that run checks CI passed on main's latest commit, tags it, and starts the
# release on the tag. The release-tag ruleset lets GitHub Actions create tags.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, like 0.2.14 (tags main as v0.2.14)"
        required: true

permissions:
  contents: read

jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # create the tag
      actions: write # start this workflow on it
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag main and start the release
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must look like 0.2.14, not '$VERSION'." >&2
            exit 1
          fi
          tag="v$VERSION"
          scripts/release-notes.sh "$tag" >/dev/null
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists." >&2
            exit 1
          fi
          ci=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=check" \
            --jq '[.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.completed_at) | last | .conclusion')
          if [ "$ci" != success ]; then
            echo "CI has not passed on $GITHUB_SHA (check: ${ci:-not run}); wait for it or fix it first." >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
          # A tag created with this token starts no workflow by itself; a
          # workflow_dispatch does.
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$tag" -f version="$VERSION"
          echo "Tagged $GITHUB_SHA as $tag; the release is running on the tag." >> "$GITHUB_STEP_SUMMARY"

  # Both ways in, a pushed tag or the tag job above, end here: the tag name
  # reaches shell commands and the formula, so it must be a plain version, the
  # release needs its section in RELEASE_NOTES.md, and CI must have passed on
  # the tagged commit.
  verify:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag, its notes, and CI
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must look like v0.2.14." >&2
            exit 1
          fi
          scripts/release-notes.sh "$GITHUB_REF_NAME" >/dev/null
          ci=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=check" \
            --jq '[.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.completed_at) | last | .conclusion')
          if [ "$ci" != success ]; then
            echo "CI has not passed on $GITHUB_SHA (check: ${ci:-not run}); wait for it or fix it first." >&2
            exit 1
          fi

  build:
    needs: verify
    strategy:
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # The engine environment holds ENGINE_READ_TOKEN, which reads the private
    # engine the official build includes. It allows v* tags only and needs no
    # approval; publishing to Homebrew, in the release environment, does.
    environment: engine
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Timing tests, which compare parse times at two sizes, are left to CI:
      # on a slow release runner they fail on noise, not on a regression.
      - name: Test
        run: go test -short -count=1 ./...
      - name: Check out the private engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rburns629/urfluency-engine
          path: engine
          token: ${{ secrets.ENGINE_READ_TOKEN }}
          persist-credentials: false
      # The workspace builds the engine against this tag's source, whatever
      # CLI version the engine's own go.mod names.
      - name: Link the engine to this source
        run: go work init . ./engine
      - name: Build archive
        env:
          PACKAGE: ./engine/cmd/urfluency
          EXPECT_ENGINE: official
        run: scripts/build-release.sh "${GITHUB_REF_NAME#v}" dist
      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.os }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write # sign the provenance
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      # Records which workflow run and commit built each archive; users can
      # check one with gh attestation verify.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      # The release's own notes come first, then GitHub's list of merged pull
      # requests. RELEASE_NOTES.md rides along: the website reads every
      # released version's notes from the latest release's copy.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release-notes.sh "$GITHUB_REF_NAME" > dist/notes.md
          cp RELEASE_NOTES.md dist/
          cd dist
          sha256sum -- *.tar.gz > checksums.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes \
            ./*.tar.gz checksums.txt RELEASE_NOTES.md
      - name: Keep archives for the tap job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/

  # HOMEBREW_TAP_TOKEN is a secret of the release environment, which requires a
  # reviewer's approval, so only an approved release can push the formula.
  tap:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Check out repository
        if: env.TAP_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download archives
        if: env.TAP_TOKEN != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Update the formula
        if: env.TAP_TOKEN != ''
        run: |
          version="${GITHUB_REF_NAME#v}"
          scripts/render-formula.sh "$version" dist > urfluency.rb
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/rburns629/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp urfluency.rb tap/Formula/urfluency.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/urfluency.rb
          git commit -m "urfluency ${version}"
          git push origin HEAD
      - name: Note a skipped tap update
        if: env.TAP_TOKEN == ''
        run: echo "HOMEBREW_TAP_TOKEN is not set; the formula was not updated."
